# WinnerProxy 部署声明（deploy-manifest v1）
# schema 依据：HA-Services-Deployer internal/manifest/（SchemaVersion=1）
manifest_version: 1
kind: service
project: winnerproxy
display_name: WinnerProxy
group: satellite
# 模板 site.version: "0.2.0"（无 git 版本 tag）。
service_version: "0.2.0"

facts:
  ports:
    # deploy/config/winnerproxy.yaml.tmpl: server.addr ":2777"；compose 默认对外映射
    - name: http
      port: 2777
      exposure: public
  health:
    # internal/router/router.go r.GET("/health", h.Health)；compose healthcheck 同路径
    http:
      port_name: http
      path: /health
      expect_status: 200
      timeout_seconds: 5
      interval_seconds: 30
      retries: 3
  smoke:
    # 部署后冒烟：走一次 Yggdrasil hasJoined（sessionserver 路径）。
    # 超长的随机用户名在 HA 与 Mojang 两侧都必然不存在：三级决策
    # （HA → Mojang → proxy-register）真实跑过 HA 查询后确定性返回 204
    # （internal/handler/handler.go HasJoined）。HRPAuth 后端不可用时
    # 走 500/503 分支，断言如实失败。用户名超过 Mojang 16 字符上限，
    # 保证永不命中真实账号、不产生注册副作用。
    - name: hasjoined-probe
      method: GET
      path: /sessionserver/session/minecraft/hasJoined?username=ha_smoke_probe_zz9999&server=ha-smoke
      expect_status: 204
      timeout_seconds: 15
  depends_on:
    # 启动期经 HRPAuth /oauth/register 自助换取凭据（main.go 提示凭据必填）；
    # upstreams.hrpauth.url 直连 Yggdrasil-API 微服务（模板注释：不带 relay 前缀）。
    # compose depends_on hrpauth + hrpauth-yggdrasil-api 均 service_healthy。
    # 无数据库、无 redis（模板无对应段，缓存为内存缓存）。
    - project: hrpauth
      kind: required
    - project: hrpauth-yggdrasil-api
      kind: required
  migration:
    # 无数据库。配置文件版本化（version: "2"）由启动期配置迁移框架处理，
    # 无持久层 schema 迁移。
    mode: none
  data_dirs: []
  config:
    # main.go configFileName="config.yml"（注意是 .yml 后缀）。
    # 模板版本 = 模板首行 version: "2"。
    - path: config.yml
      template_version: "2"
  static_assets: ""

baremetal:
  process:
    manager: aapanel
  install:
    # PROD-FILEREFRESH-20261107 §1：二进制在位路径 /www/wwwroot/wp/winnerproxy
    root: /www/wwwroot/wp
    binary_name: winnerproxy
  artifact:
    source: local_path
    local_path: build/winnerproxy

container:
  enabled: false
  # 容器形态镜像：已真实发布（Docker Hub，build → push → 回拉 → 挂回
  # compose 平台冒烟全过）。镜像为 linux/amd64 + linux/arm64 多架构
  # manifest list，digest 钉的是 manifest list 摘要（非单平台子摘要），
  # 为生效引用，tag 仅可读别名。
  # 部署时 Deployer 按 digest 优先真实拉取本镜像（鉴权沿用宿主 docker 登录态；拉后摘要对照不符即响亮失败）。
  image:
    source: registry
    repo: limeight/ha-winnerproxy
    tag: "0.2.0-de34ed2"
    digest: "sha256:51795ffad54b8bb90e36470ae857f0414c26eb64185e7562aa999eecbda0b7bc"
